name: resiliencemesh
description: Tactical First-Aid & Disaster Response Node
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  record: 5.1.2
  path_provider: ^2.1.3
  http: ^1.2.1
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  flutter_markdown: ^0.7.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_gemma: ^0.12.6
  file_picker: ^8.0.5

dependency_overrides:
  record_linux:
    path: ./test_stubs/record_linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icons/
